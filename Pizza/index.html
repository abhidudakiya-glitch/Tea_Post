<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>AR Product Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
font-family:sans-serif;
text-align:center;
background:#f0f0f0;
}

model-viewer{
width:100%;
height:80vh;
}

/* Instruction near AR button */

.ar-tip{
position:fixed;
bottom:90px;
right:15px;
font-size:14px;
font-weight:600;
color:#333;
background:rgba(255,255,255,0.95);
padding:6px 10px;
border-radius:8px;
z-index:9999;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
display:flex;
align-items:center;
gap:6px;
}

/* Arrow animation */

.arrow{
font-size:18px;
animation: move 1s infinite;
}

@keyframes move{
0%{transform:translateX(0);}
50%{transform:translateX(6px);}
100%{transform:translateX(0);}
}

</style>

</head>

<body>

<h2>3D Preview</h2>

<!-- YOUR ORIGINAL MODEL LOADER -->
<div id="app">Loading model...</div>

<!-- Instruction -->
<div class="ar-tip">
<div class="arrow">➡️</div>
<div>Click to place on Table</div>
</div>

<script src="script.js"></script>

</body>

</html>
