<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>AR Product Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
font-family:sans-serif;
text-align:center;
background:#f0f0f0;
}

model-viewer{
width:100%;
height:80vh;
}

/* Instruction beside AR button */

.ar-tip{
position:fixed;
bottom:42px;      /* Android alignment */
right:75px;
font-size:14px;
font-weight:600;
color:#333;
background:#fff;
padding:6px 12px;
border-radius:20px;
box-shadow:0 3px 8px rgba(0,0,0,0.2);
z-index:9999;
display:flex;
align-items:center;
gap:6px;
pointer-events:none;
}

/* arrow animation */

.arrow{
font-size:16px;
animation: bounce 1s infinite;
}

@keyframes bounce{
0%{transform:translateX(0);}
50%{transform:translateX(5px);}
100%{transform:translateX(0);}
}

/* iPhone Safari fix */

@supports (-webkit-touch-callout: none) {
  .ar-tip{
    bottom:125px;   /* slightly higher for iPhone */
  }
}

</style>

</head>

<body>

<h2>3D Preview</h2>

<div id="app">Loading model...</div>

<!-- Instruction beside AR button -->

<div class="ar-tip">
Click to place on Table
<span class="arrow">➡️</span>
</div>

<script src="script.js"></script>

</body>

</html>
