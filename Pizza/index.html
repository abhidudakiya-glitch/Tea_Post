<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>AR Product Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
font-family:sans-serif;
text-align:center;
background:#f0f0f0;
}

model-viewer{
width:100%;
height:80vh;
}

/* AR instruction container */
.ar-guide{
position:fixed;
bottom:90px;
right:20px;
display:flex;
align-items:center;
gap:8px;
font-size:14px;
font-weight:600;
color:#333;
}

/* Arrow animation */
.arrow{
font-size:22px;
animation: bounce 1s infinite;
}

@keyframes bounce{
0%{transform:translateX(0);}
50%{transform:translateX(-6px);}
100%{transform:translateX(0);}
}

</style>

</head>

<body>

<h2>3D Preview</h2>

<div id="app">Loading model...</div>

<!-- AR Instruction -->
<div class="ar-guide">
<div>Click to place on Table</div>
<div class="arrow">⬇️</div>
</div>

<script src="script.js"></script>

</body>
</html>
