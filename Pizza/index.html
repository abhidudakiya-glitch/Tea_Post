<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>AR Product Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
font-family:sans-serif;
text-align:center;
background:#f0f0f0;
}

h2{
margin-top:10px;
}

model-viewer{
width:100%;
height:80vh;
background:#f0f0f0;
}

/* Instruction box */
.ar-tip{
position:fixed;
top:140px;
right:70px;
font-size:14px;
font-weight:600;
color:#333;
background:rgba(255,255,255,0.9);
padding:6px 10px;
border-radius:8px;
display:flex;
align-items:center;
gap:6px;
z-index:9999;
box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

/* Arrow animation */
.arrow{
font-size:18px;
animation: move 1s infinite;
}

@keyframes move{
0%{transform:translateX(0);}
50%{transform:translateX(6px);}
100%{transform:translateX(0);}
}

</style>

</head>

<body>

<h2>3D Preview</h2>

<model-viewer
src="Models/pizza.glb"
ios-src="Models/pizza.usdz"
ar
ar-modes="scene-viewer quick-look webxr"
camera-controls
auto-rotate
shadow-intensity="1"
alt="3D Pizza Model">
</model-viewer>

<!-- Instruction -->
<div class="ar-tip">
<div class="arrow">➡️</div>
<div>Click to place on Table</div>
</div>

</body>
</html>
